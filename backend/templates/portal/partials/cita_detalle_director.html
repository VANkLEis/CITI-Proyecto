<div class="cita-modal-inner">
  <div class="cita-modal-header-inline">
    <h3>Caso #{{ cita.pk }} — {{ cita.franja.get_area_display }}</h3>
    <button type="button" class="btn-icon-close cita-modal-close" aria-label="Cerrar">&times;</button>
  </div>
  <p class="cita-muted" style="margin:0 1.25rem 1rem;">Vista de dirección: solo lectura, sin acciones administrativas.</p>
  {% include "portal/partials/cita_info_block.html" %}

  <div class="cita-modal-actions">
    <h4>Comunicación del caso</h4>
    {% include "portal/partials/interaccion_list.html" %}
  </div>

  <div class="cita-bitacora-preview">
    <a href="{% url 'portal:trazabilidad' %}" class="btn btn-sm btn-secondary">Ver en trazabilidad</a>
  </div>
</div>
